<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6fffa"/>
      <stop offset="0.45" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0e17"/>
  <!-- face-scan corner brackets -->
  <g fill="none" stroke="#5eead4" stroke-width="3.2" stroke-linecap="round" opacity="0.9">
    <path d="M9 19V11a2 2 0 0 1 2-2h8"/>
    <path d="M45 9h8a2 2 0 0 1 2 2v8"/>
    <path d="M55 45v8a2 2 0 0 1-2 2h-8"/>
    <path d="M19 55h-8a2 2 0 0 1-2-2v-8"/>
  </g>
  <!-- scanning ring with a gap, like the loader -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#ring)" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="72 16" transform="rotate(-60 32 32)"/>
  <!-- glowing core -->
  <circle cx="32" cy="32" r="9" fill="url(#core)"/>
  <circle cx="32" cy="32" r="3.6" fill="#e6fffa"/>
</svg>
